# Rain Gauge Plus — example Lovelace card
#
# look: tube | wedge | cone | taper | glass7 | fence | garden
#   tube    Classic tube (5 in) — honors max_level
#   wedge   Yellow wedge (6 in)
#   cone    Blue cone (2 in)
#   taper   Clear taper (5 in)
#   glass7  Glass cylinder (7 in)
#   fence   Fence cup (6 in)
#   garden  Garden stake (7 in)
#
# size: 100 | 75 | 50
#   100  Full size (default)
#   75   Three-quarter scale
#   50   Half size

type: custom:rain-gauge-plus-card
name: Rain Gauge
look: tube
size: 100
entity: sensor.rain_total_today
hourly_rate_entity: sensor.outside_wind_and_rain_precipitation
max_level: 5
unit_system: imperial
history_days: 14
show_history: true
show_yesterday: true
show_rate: true
